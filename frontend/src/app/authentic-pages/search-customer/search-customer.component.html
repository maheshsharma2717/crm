<main class="flex-grow flex flex-col   ">
    <div class="container mx-auto">
        <div class="p-6 max-w-[80%] mx-auto">

            <div class="flex justify-between items-center mb-4">
                <h1 class="text-2xl font-semibold">Search</h1>

            </div>

            <div class="flex md:flex-row flex-col justify-between">
                <input type="text" placeholder="Search by name, company etc." [(ngModel)]="searchText"
                    class="md:w-[50%] p-3 border border-gray-300 rounded-md mb-6 bg-white focus:outline-none focus:ring-2 focus:ring-blue-300" />


                <button
                    class="p-3 border  md:w-[20%] border-red-500 text-red-500 rounded-md mb-6  focus:outline-none focus:ring-2 hover:bg-red-50 transition"
                    (click)="openDialog()">
                    Add New Customer
                </button>
                <div *ngIf="showModal"
                    class="fixed inset-0 flex items-center    justify-center bg-black bg-opacity-50 z-50">
                    <div class="bg-white w-11/12 max-w-md p-6 rounded-3xl transition-all duration-200 shadow-lg">
                        <h2 class="text-xl font-semibold mb-4">Add New Customer</h2>

                        <form [formGroup]="customerForm" (ngSubmit)="onSubmit()" class="add-new-customer-form mb-4">
                            <div class="flex flex-wrap -mx-2">
                              
                              <div class="w-full md:w-1/2 px-2 mb-4">
                                <label for="usdot" class="block text-sm font-medium text-gray-700 mb-1">USDOT</label>
                                <input id="usdot" type="text" formControlName="usdot"
                                       class="w-full bg-transparent rounded border border-gray-200 focus:outline-none focus:ring-0 focus:border-gray-300 text-sm px-3 py-2">
                                       <div *ngIf="customerForm.get('usdot')?.invalid && customerForm.get('usdot')?.touched"
                                       class="text-red-500 text-sm text-center">
                                       USDOT no is required
                                   </div>
                                    </div>
                          
                              <div class="w-full md:w-1/2 px-2 mb-4">
                                <label for="company" class="block text-sm font-medium text-gray-700 mb-1">Company</label>
                                <input id="company" type="text" formControlName="company"
                                       class="w-full bg-transparent rounded border border-gray-200 focus:outline-none focus:ring-0 focus:border-gray-300 text-sm px-3 py-2">
                                       <div *ngIf="customerForm.get('company')?.invalid && customerForm.get('company')?.touched"
                                       class="text-red-500 text-sm text-center">
                                       company name is required
                                   </div>
                                  </div>
                          
                              <div class="w-full md:w-1/2 px-2 mb-4">
                                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                                <input id="name" type="text" formControlName="name"
                                       class="w-full bg-transparent rounded border border-gray-200 focus:outline-none focus:ring-0 focus:border-gray-300 text-sm px-3 py-2">
                                       <div *ngIf="customerForm.get('name')?.invalid && customerForm.get('name')?.touched"
                                       class="text-red-500 text-sm text-center">
                                       Name is required
                                   </div>
                                  </div>
                          
                              <div class="w-full md:w-1/2 px-2 mb-4">
                                <label for="contact" class="block text-sm font-medium text-gray-700 mb-1">Contact</label>
                                <input id="contact" type="text" formControlName="contact"
                                       class="w-full bg-transparent rounded border border-gray-200 focus:outline-none focus:ring-0 focus:border-gray-300 text-sm px-3 py-2">
                                       <div *ngIf="customerForm.get('contact')?.invalid && customerForm.get('contact')?.touched"
                                       class="text-red-500 text-sm text-center">
                                       Contact is required
                                   </div>
                                   </div>
                          
                            </div>
                          
                            <div class="flex justify-end px-2">

                              <div class="flex   justify-end space-x-2">
                                <button class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400" (click)="closeDialog()">
                                    Cancel
                                </button>
                                <button type="submit" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">
                                    Save
                                </button>
                            </div>
                            </div>
                          </form>
                          



                       
                    </div>
                </div>
            </div>

            <div class="space-y-4  z-50">
             

                <div *ngFor="let item of filteredItems()"
                class="border border-gray-300 bg-white transition-all duration-300 ease-in-out rounded-xl p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
              
            
                <div class="flex items-start gap-2 flex-1">
                  <i class="fas fa-building text-gray-500 mt-1 mx-2"></i>
                  <div>
                    <p class="font-bold text-red-600">{{ item.company }}</p>
                    <div class="flex flex-wrap items-center gap-2 text-sm text-gray-600 mt-1">
                      <i class="fas fa-user"></i> {{ item.contact }}
                      <i class="fas fa-phone ml-4"></i> {{ item.phone }}
                      <i class="fas fa-stamp ml-4"></i>
                      
                      <span class="font-semibold">USDOT:</span> {{ item.usdot }}
                    </div>
                  </div>
                </div>
              
     
                <div class="self-start sm:self-center">
                  <button (click)="navigateDetails(item)" class="text-red-500 hover:text-red-700 font-medium">
                    View Payment Methods
                  </button>
                </div>
              </div>
              

            </div>

        </div>

    </div>




</main>
