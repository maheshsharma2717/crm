<main class="flex-grow flex flex-col   ">
    <div class="container mx-auto">
        <div class="p-6 max-w-[80%] mx-auto">

            <div class="flex justify-between items-center mb-4">
                <h1 class="text-2xl font-semibold">Customer Details</h1>

            </div>

            <div class="flex md:flex-row flex-col justify-between">
                <input type="text" placeholder="Search by name, company etc."
                    class="md:w-[40%] p-3 border border-gray-300  rounded-md mb-6 bg-white focus:outline-none focus:ring-2  focus:ring-blue-300" />


                <button
                    class="p-3 border  md:w-[20%] border-red-500 text-red-500 rounded-md mb-6  focus:outline-none focus:ring-2 hover:bg-red-50 transition"
                    (click)="openDialog()">
                    Link New Card
                </button>
                <div *ngIf="showModal"
                    class="fixed inset-0 flex items-center    justify-center bg-black bg-opacity-50 z-50">
                    <div class="bg-white w-[100%] max-w-xl p-6 rounded-3xl transition-all duration-200 shadow-lg">
                        <h2 class="text-xl font-semibold mb-4">Enter Bank Details</h2>



                        <div class="mx-auto max-w-screen-xl px-4 2xl:px-0">
                            <div class="mx-auto max-w-5xl">


                                <div class="mt-6 sm:mt-8 lg:flex lg:items-start lg:gap-12">
                                    <form action="#"
                                        class="w-full rounded-lg border mb-4 border-gray-200 bg-white p-4 shadow-sm dark:border-gray-700 dark:bg-gray-800 sm:p-6 lg:max-w-xl lg:p-8">
                                        <div class="mb-6 grid grid-cols-2 gap-4">
                                            <div class="col-span-2 sm:col-span-1">
                                                <label for="full_name"
                                                    class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">
                                                    Full name (as displayed on card)* </label>
                                                <input type="text" id="full_name"
                                                    class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-primary-500 focus:ring-primary-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder:text-gray-400 dark:focus:border-primary-500 dark:focus:ring-primary-500"
                                                    placeholder="Enter Name" required />
                                            </div>

                                            <div class="col-span-2 sm:col-span-1">
                                                <label for="card-number-input"
                                                    class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">
                                                    Card number* </label>
                                                <input type="text" id="card-number-input"
                                                    class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 pe-10 text-sm text-gray-900 focus:border-primary-500 focus:ring-primary-500  dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder:text-gray-400 dark:focus:border-primary-500 dark:focus:ring-primary-500"
                                                    placeholder="xxxx-xxxx-xxxx-xxxx"
                                                    pattern="^4[0-9]{12}(?:[0-9]{3})?$" required />
                                            </div>

                                            <div>
                                                <label for="card-expiration-input"
                                                    class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">Card
                                                    expiration* </label>
                                                <div class="relative">

                                                    <input type="text" id="card-expiration-input"
                                                        class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 ps-9 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder:text-gray-400 dark:focus:border-blue-500 dark:focus:ring-blue-500"
                                                        placeholder="MM/YY" maxlength="5" [ngModel]="cardExpiry"
                                                        (ngModelChange)="onCardExpiryChange($event)" required />

                                                </div>
                                            </div>
                                            <div>
                                                <label for="cvv-input"
                                                    class="mb-2 flex items-center gap-1 text-sm font-medium text-gray-900 dark:text-white">
                                                    CVV*
                                                    <button data-tooltip-target="cvv-desc" data-tooltip-trigger="hover"
                                                        class="text-gray-400 hover:text-gray-900 dark:text-gray-500 dark:hover:text-white">
                                                        <svg class="h-4 w-4" aria-hidden="true"
                                                            xmlns="http://www.w3.org/2000/svg" fill="currentColor"
                                                            viewBox="0 0 24 24">
                                                            <path fill-rule="evenodd"
                                                                d="M2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10S2 17.523 2 12Zm9.408-5.5a1 1 0 1 0 0 2h.01a1 1 0 1 0 0-2h-.01ZM10 10a1 1 0 1 0 0 2h1v3h-1a1 1 0 1 0 0 2h4a1 1 0 1 0 0-2h-1v-4a1 1 0 0 0-1-1h-2Z"
                                                                clip-rule="evenodd" />
                                                        </svg>
                                                    </button>
                                                    <div id="cvv-desc" role="tooltip"
                                                        class="tooltip invisible absolute z-10 inline-block rounded-lg bg-gray-900 px-3 py-2 text-sm font-medium text-white opacity-0 shadow-sm transition-opacity duration-300 dark:bg-gray-700">
                                                        The last 3 digits on back of card
                                                        <div class="tooltip-arrow" data-popper-arrow></div>
                                                    </div>
                                                </label>
                                                <input type="text" maxlength="3" id="cvv-input"
                                                    aria-describedby="helper-text-explanation"
                                                    class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-primary-500 focus:ring-primary-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder:text-gray-400 dark:focus:border-primary-500 dark:focus:ring-primary-500"
                                                    placeholder="•••" required />
                                            </div>
                                        </div>

                                        <button type="submit"
                                            class="flex w-full items-center justify-center rounded-lg bg-primary-700 px-5 py-2.5 text-sm font-medium text-white hover:bg-primary-800 focus:outline-none focus:ring-4  focus:ring-primary-300 dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800">Pay
                                            now</button>
                                    </form>





                                </div>


                            </div>
                        </div>







                        <div class="flex   justify-end space-x-2">
                            <button class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400" (click)="closeDialog()">
                                Cancel
                            </button>
                            <button class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">
                                Save
                            </button>
                        </div>
                    </div>
                </div>
            </div>

                <div
                    class="border border-gray-300 bg-white cursor-pointer hover:scale-105 transition-all duration-300 ease-in-out rounded-xl p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div class="flex items-start gap-2">
                        <i class="fas fa-bank text-gray-500 mt-1"></i>
                        <div>
                            <p class="font-bold text-red-600">Bank name</p>
                            <div class="flex flex-wrap items-center gap-2 text-sm text-gray-600 mt-1">

                                <i class="fas fa-money-bills ml-4"></i> <span class="font-semibold">atm Details:</span>

                            </div>
                        </div>
                    </div>
                </div>
              



            </div>

        </div>

    </div>




</main>
